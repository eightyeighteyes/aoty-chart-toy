name: Deploy

# One deploy, three ways in:
#   - workflow_call from cd.yml: staging, after CI passes on main
#   - push of a v* tag (release-please, via the GitHub App): production. The tag ref is what
#     the `production` environment's deployment rule allows.
#   - workflow_dispatch: rollback / redeploy, e.g.
#       gh workflow run deploy.yml --ref v0.1.0 -f environment=production
#     skip_terraform defaults to true there, so an old tag only rolls back code and the shell,
#     never infrastructure.
#   - workflow_dispatch to sandbox from any branch, before its PR merges (AOTY-33):
#       gh workflow run deploy.yml --ref my-branch -f environment=sandbox -f skip_terraform=false
#     The `sandbox` environment allows every branch but waits for a reviewer. Sandbox isn't on
#     kamp.fm: no shell upload, and the smoke test calls the execute-api URL directly.
#     A branch can edit this file, so none of that is a guard; the sandbox role's IAM is.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      ref:
        type: string
        required: true
      skip_terraform:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production, sandbox]
        required: true
      skip_terraform:
        description: "Skip terraform apply (code + shell only). Keep on for rollbacks."
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  deploy:
    name: deploy (${{ inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    # One deploy per env at a time; a queued one waits rather than cancelling a running apply.
    concurrency:
      group: deploy-${{ inputs.environment || 'production' }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      # GitHub environment "production" is infra env "prod"; staging and sandbox keep their names.
      AOTY_ENV: ${{ (inputs.environment || 'production') == 'production' && 'prod' || inputs.environment }}
      SKIP_TERRAFORM: ${{ inputs.skip_terraform == true }}
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # The commit being deployed, as the zips' build.json records it (AOTY-35). Not github.sha:
      # via cd.yml's workflow_call that's main's tip, which can be newer than the checked-out
      # workflow_run head_sha.
      - name: build sha
        run: echo "BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: package lambdas
        run: python scripts/package_lambdas.py

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.9"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::424416271636:role/kamp-aoty-ci/kamp-aoty-${{ env.AOTY_ENV }}-deploy
          role-session-name: aoty-deploy-${{ env.AOTY_ENV }}-${{ github.run_id }}
          aws-region: us-east-1

      - name: terraform
        working-directory: infra/envs/${{ env.AOTY_ENV }}
        run: |
          set -euo pipefail
          terraform init -input=false -no-color
          if [ "$SKIP_TERRAFORM" = "true" ]; then
            echo "skip_terraform: not applying"
          else
            terraform apply -input=false -no-color -auto-approve -lock-timeout=5m
          fi
          terraform output -json stack > "$RUNNER_TEMP/stack.json"
          {
            echo "BASE_PATH=$(jq -r .base_path "$RUNNER_TEMP/stack.json")"
            echo "S3_PREFIX=$(jq -r .s3_key_prefix "$RUNNER_TEMP/stack.json")"
            echo "SITE_BUCKET=$(jq -r .site_bucket_name "$RUNNER_TEMP/stack.json")"
            echo "API_ENDPOINT=$(jq -r .api_endpoint "$RUNNER_TEMP/stack.json")"
          } >> "$GITHUB_ENV"

      - name: lambda code
        env:
          ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          for fn in api sync mb; do
            name=$(jq -r ".function_names.$fn" "$RUNNER_TEMP/stack.json")
            # Wait first: a config change from the apply above leaves the function "InProgress",
            # and update-function-code would fail with ResourceConflictException.
            aws lambda wait function-updated --function-name "$name"
            code_sha=$(aws lambda update-function-code --function-name "$name" \
              --zip-file "fileb://dist/$fn.zip" --query CodeSha256 --output text)
            aws lambda wait function-updated --function-name "$name"
            # Publish separately to label the version. --code-sha256 refuses to publish if $LATEST
            # isn't the upload above. Every deploy gets a new version, even a same-commit redeploy:
            # update-function-code modifies $LATEST even when the bytes match (seen in sandbox).
            version=$(aws lambda publish-version --function-name "$name" --code-sha256 "$code_sha" \
              --description "$BUILD_SHA by $ACTOR" --query Version --output text)
            echo "$name -> version $version"
          done

      # The release index build (AOTY-20) is a Fargate task that fetches its code from the store
      # bucket at start, so this upload is its deploy. The next scheduled run picks it up.
      - name: index build code
        run: |
          set -euo pipefail
          bucket=$(jq -r .store_bucket_name "$RUNNER_TEMP/stack.json")
          key=$(jq -r '.index_task.code_key // empty' "$RUNNER_TEMP/stack.json")
          if [ -z "$key" ]; then
            echo "no index task in this env's state yet: code upload skipped"
            exit 0
          fi
          aws s3 cp dist/index.zip "s3://$bucket/$key" --only-show-errors
          echo "dist/index.zip -> s3://$bucket/$key"

      # No shell yet (later stories add web/): skip, so /toys/aoty/ keeps returning 404 and the
      # --delete pass below can never empty the prefix. Never for sandbox, which kamp.fm doesn't
      # serve (and whose role has no CloudFront access).
      - name: static shell
        id: shell
        if: env.AOTY_ENV != 'sandbox'
        run: |
          set -euo pipefail
          if [ ! -f web/index.html ]; then
            echo "no web/index.html: shell upload and invalidation skipped"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dest="s3://$SITE_BUCKET/$S3_PREFIX"
          # 1. Everything but index.html: hashed assets, cached for a year.
          aws s3 sync web/ "$dest" --exclude index.html --exclude 'data/*' \
            --cache-control "public, max-age=31536000, immutable"
          # 2. index.html last, so it never points at assets that aren't uploaded yet.
          aws s3 cp web/index.html "${dest}index.html" --cache-control "no-cache"
          # 3. Remove what the new build dropped; data/ belongs to the chart builder.
          aws s3 sync web/ "$dest" --delete --exclude 'data/*' --size-only
          id=$(aws cloudfront create-invalidation --distribution-id EU1A3HSUCEQS9 \
            --paths "${BASE_PATH}*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id EU1A3HSUCEQS9 --id "$id"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: smoke test
        env:
          SHELL_DEPLOYED: ${{ steps.shell.outputs.deployed }}
        run: |
          set -euo pipefail
          # Sandbox has no kamp.fm path: call the HTTP API directly. The Lambda strips BASE_PATH
          # itself, so the path is the same as through CloudFront.
          if [ "$AOTY_ENV" = "sandbox" ]; then
            site="${API_ENDPOINT}${BASE_PATH}"
          else
            site="https://kamp.fm${BASE_PATH}"
          fi
          check() {  # check <expected status> <url>
            status=$(curl -s -o "$RUNNER_TEMP/body" -w '%{http_code}' --retry 3 --retry-all-errors "$2")
            echo "$status $2"
            [ "$status" = "$1" ] || { echo "::error::expected $1, got $status for $2"; cat "$RUNNER_TEMP/body"; exit 1; }
          }
          # Prove this commit's code is live: not Terraform's placeholder, not an older $LATEST,
          # and in the right env. A 200 with the wrong body is retried too, and the query string
          # keeps any cache in front of the API out of it.
          live=false
          for attempt in 1 2 3 4 5; do
            check 200 "${site}api/health?deploy=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            if jq -e --arg env "$AOTY_ENV" --arg sha "$BUILD_SHA" \
              '.source == "lambdas/api" and .env == $env and .sha == $sha' "$RUNNER_TEMP/body" > /dev/null; then
              live=true
              break
            fi
            echo "attempt $attempt: health isn't $BUILD_SHA in $AOTY_ENV yet: $(cat "$RUNNER_TEMP/body")"
            sleep 5
          done
          if [ "$live" != "true" ]; then
            echo "::error::/api/health doesn't report $BUILD_SHA in $AOTY_ENV"
            exit 1
          fi
          # The site bucket is only reachable through kamp.fm's CloudFront.
          if [ "$AOTY_ENV" != "sandbox" ]; then
            check 404 "${site}data/users/__smoke__/chart.json"
          fi
          if [ "$SHELL_DEPLOYED" = "true" ]; then
            check 200 "$site"
          fi

      # Sandbox is shared and the last deploy wins, so record what's there now and who put it.
      - name: summary
        if: always()
        env:
          REF: ${{ inputs.ref || github.ref_name }}
          ACTOR: ${{ github.triggering_actor }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### Deploy to \`$AOTY_ENV\`: $STATUS"
            echo "- ref: \`$REF\` (\`${BUILD_SHA:-$(git rev-parse HEAD)}\`)"
            echo "- by: $ACTOR"
            echo "- terraform: $([ "$SKIP_TERRAFORM" = "true" ] && echo skipped || echo applied)"
          } >> "$GITHUB_STEP_SUMMARY"
