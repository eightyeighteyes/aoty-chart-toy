name: OIDC probe (AOTY-33, temporary)

# Throwaway: proves a job in the `sandbox` environment can assume only the sandbox deploy role.
# It runs on push to this branch only, so it never needs to be on main. Delete the branch after.
on:
  push:
    branches: [aoty-33-oidc-probe]

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      id-token: write
    env:
      AWS_REGION: us-east-1
    steps:
      - name: assume each CI role with the sandbox OIDC token
        run: |
          set -uo pipefail
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c 'import base64,json,sys; p=sys.argv[1].split(".")[1]; print("token sub:", json.loads(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4)))["sub"])' "$token"
          base=arn:aws:iam::424416271636:role/kamp-aoty-ci
          fail=0
          for case in "kamp-aoty-sandbox-deploy allow" "kamp-aoty-staging-deploy deny" \
                      "kamp-aoty-prod-deploy deny" "kamp-aoty-plan deny"; do
            set -- $case
            if out=$(aws sts assume-role-with-web-identity --role-arn "$base/$1" \
                 --role-session-name aoty33-probe --web-identity-token "$token" \
                 --query AssumedRoleUser.Arn --output text 2>&1); then
              got=allow
            else
              got=deny
            fi
            verdict=$([ "$got" = "$2" ] && echo PASS || echo FAIL)
            echo "$verdict $1: expected $2, got $got -- $out"
            [ "$verdict" = PASS ] || fail=1
          done
          exit $fail
